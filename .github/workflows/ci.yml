name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: demo_web/backend/requirements-ci.lock
      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r demo_web/backend/requirements-ci.lock
      - name: Prepare ignored runtime data directory
        run: New-Item -ItemType Directory -Force demo_web/data | Out-Null
      - name: Run backend tests
        run: python -m pytest demo_web/backend/tests -q --disable-warnings --basetemp demo_web/data/pytest-ci

  openclaw-plugin:
    name: openclaw-plugin
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run OpenClaw plugin tests
        working-directory: demo_web/openclaw_plugin/aegis-admission-ui
        run: npm test

  frontend:
    name: frontend
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked frontend dependencies
        working-directory: demo_web/frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: demo_web/frontend
        run: pnpm test
      - name: Build frontend
        working-directory: demo_web/frontend
        run: pnpm build
